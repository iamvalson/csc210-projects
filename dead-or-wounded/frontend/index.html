<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead or Wounded</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Dead or Wounded</h1>
  <p class="subtitle">Guess the secret number. <strong>Dead</strong> = right digit, right spot. <strong>Wounded</strong> = right digit, wrong spot.</p>

  <section id="new-game-section">
    <form id="new-game-form">
      <label for="player-name">Player name</label>
      <input type="text" id="player-name" placeholder="Alice" autocomplete="off">
      <button type="submit">New Game</button>
    </form>
  </section>

  <section id="game-section" class="hidden">
    <div class="info-row">
      <span id="info-length"></span>
      <span id="info-attempts"></span>
    </div>

    <form id="guess-form">
      <label for="guess-input">Your guess</label>
      <input type="text" id="guess-input" inputmode="numeric" autocomplete="off">
      <button type="submit">Guess</button>
    </form>

    <p id="status-line"></p>

    <table id="history-table">
      <thead>
        <tr><th>#</th><th>Guess</th><th>Dead</th><th>Wounded</th></tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>

  <p id="error-line" class="error hidden"></p>
</main>

<script src="app.js"></script>
</body>
</html>
